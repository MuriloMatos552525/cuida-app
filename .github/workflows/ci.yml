name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (tipos, lint e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest --ci
      - name: Build web
        run: npx expo export --platform web

  backend:
    name: Backend (Cloud Functions e regras do Firestore)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Testes de preço e estados
        run: npm test -- --ci
      - name: Testes no emulador (regras de segurança e regras de negócio)
        run: npm run test:emulator
