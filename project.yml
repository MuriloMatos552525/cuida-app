# Gera o CuidaApp.xcodeproj. No Mac: brew install xcodegen && xcodegen generate
name: CuidaApp
options:
  bundleIdPrefix: br.com.cuidaapp
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CuidaKit:
    path: Packages/CuidaKit
targets:
  CuidaApp:
    type: application
    platform: iOS
    sources:
      - path: App
    configFiles:
      Debug: Config/Config.xcconfig
      Release: Config/Config.xcconfig
    dependencies:
      - package: CuidaKit
        product: Core
      - package: CuidaKit
        product: DesignSystem
      - package: CuidaKit
        product: SupabaseData
      - package: CuidaKit
        product: Features
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CuidaApp
        CFBundleDevelopmentRegion: pt-BR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Usamos sua localização para encontrar cuidadores perto de você e, durante o serviço, para o botão de emergência."
        NSCameraUsageDescription: "A câmera é usada para a selfie de verificação de identidade e para enviar documentos."
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.cuidaapp.app
        GENERATE_INFOPLIST_FILE: NO
